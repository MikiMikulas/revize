<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revizní zprávy</title>
<meta name="description" content="Sestavení revizních zpráv elektroinstalace – funguje i offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revize">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171b23" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --panel-2:#f8f9fb; --ink:#111827; --ink-2:#374151; --muted:#6b7280; --line:#e5e7eb; --line-2:#d1d5db;
  --accent:#2563eb; --accent-2:#1d4ed8; --accent-ink:#ffffff; --soft:#eff4ff; --soft-ink:#1e40af;
  --ok:#15803d; --ok-soft:#ecfdf3; --bad:#dc2626; --bad-soft:#fef2f2; --idle:#9ca3af;
  --input:#ffffff; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06); --shadow-lg:0 10px 30px rgba(16,24,40,.12);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --panel:#171b23; --panel-2:#1c212b; --ink:#f3f4f6; --ink-2:#d1d5db; --muted:#9aa3b2; --line:#272d39; --line-2:#363d4b;
    --accent:#5b8cff; --accent-2:#7aa2ff; --accent-ink:#0b1020; --soft:#1a2440; --soft-ink:#a9c1ff;
    --ok:#4ade80; --ok-soft:#12261b; --bad:#f87171; --bad-soft:#2d1717; --idle:#5b6472;
    --input:#11151c; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#171b23; --panel-2:#1c212b; --ink:#f3f4f6; --ink-2:#d1d5db; --muted:#9aa3b2; --line:#272d39; --line-2:#363d4b;
  --accent:#5b8cff; --accent-2:#7aa2ff; --accent-ink:#0b1020; --soft:#1a2440; --soft-ink:#a9c1ff;
  --ok:#4ade80; --ok-soft:#12261b; --bad:#f87171; --bad-soft:#2d1717; --idle:#5b6472;
  --input:#11151c; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- horní lišta ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:saturate(1.6) blur(10px);-webkit-backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px;fill:#fff;stroke:none}
.brand h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.grow{flex:1}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* kroky */
.steps{max-width:1440px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.steps button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);padding:10px 12px 11px;font:inherit;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.steps button .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted)}
.steps button:hover{color:var(--ink)}
.steps button.on{color:var(--ink);border-bottom-color:var(--accent)}
.steps button.on .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps .cnt{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.steps .cnt.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

main{padding:22px 20px 80px;max-width:1440px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h2{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:680}
.ph p{margin:4px 0 0;color:var(--muted)}

/* ---------- tlačítka ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);border-radius:8px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer;box-shadow:var(--shadow);transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel-2);border-color:var(--idle)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2)}
.btn.ghost{background:none;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:5px 9px;font-size:13px}
.ib{display:inline-grid;place-items:center;width:28px;height:28px;border:0;background:none;color:var(--muted);border-radius:7px;cursor:pointer}
.ib:hover{background:var(--panel-2);color:var(--ink)}
.ib.del:hover{background:var(--bad-soft);color:var(--bad)}
.btn:focus-visible,.ib:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- karty a formuláře ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px;font-weight:620}
.card-b{padding:16px 18px}
.fs{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:20px 22px;border-top:1px solid var(--line)}
.fs:first-child{border-top:0}
.fs-h h3{margin:0 0 4px;font-size:14px;font-weight:620}
.fs-h p{margin:0;color:var(--muted);font-size:13px}
@media (max-width:860px){.fs{grid-template-columns:1fr;gap:12px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;min-width:0;transition:border-color .12s,box-shadow .12s}
input::placeholder,textarea::placeholder{color:var(--idle)}
input:hover,select:hover,textarea:hover{border-color:var(--idle)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{width:100%;resize:vertical;min-height:64px;font-size:13.5px;line-height:1.5}
.hint{color:var(--muted);font-size:12.5px}
.calc{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;background:var(--soft);color:var(--soft-ink);font-weight:600;font-size:13px}

/* přepínač */
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;color:var(--ink-2);user-select:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .tr{width:34px;height:20px;border-radius:20px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked + .tr{background:var(--accent)}
.sw input:checked + .tr::after{transform:translateX(14px)}
.sw input:focus-visible + .tr{outline:2px solid var(--accent);outline-offset:2px}
.swl{display:flex;flex-direction:column;gap:12px}

/* čip (3f / RCD / testy) */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:38px;padding:3px 8px;border-radius:7px;border:1px solid var(--line-2);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;background:var(--panel)}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip:has(input:checked){background:var(--soft);border-color:var(--accent);color:var(--soft-ink)}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}

/* segmentový přepínač */
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg span{display:block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted)}
.seg input:checked + span{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible + span{outline:2px solid var(--accent)}

/* ---------- rozvržení s postranním seznamem ---------- */
.split{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.side{position:sticky;top:120px}
@media (max-width:900px){.side{position:static}}
.side .card-b{padding:8px}
.bl{display:flex;flex-direction:column;gap:2px}
.bl button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit;width:100%}
.bl button:hover{background:var(--panel-2)}
.bl button.on{background:var(--soft);color:var(--soft-ink)}
.bl .bi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);flex:none}
.bl button.on .bi{background:var(--accent);color:var(--accent-ink)}
.bl .bt{min-width:0;flex:1}
.bl .bt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl .bt small{color:var(--muted);font-size:12px}
.bl .wn{font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:1px 7px}
.side-f{display:flex;gap:2px;padding:8px;border-top:1px solid var(--line);align-items:center}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---------- tabulka obvodů ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0}
table.t th{position:sticky;top:0;background:var(--panel-2);font-size:11.5px;color:var(--muted);text-align:left;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
table.t th:first-child{padding-left:18px}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td:first-child{padding-left:18px}
table.t td input[type=text]{width:100%;border-color:transparent;background:transparent;padding:6px 8px}
table.t td input[type=text]:hover{border-color:var(--line-2);background:var(--input)}
table.t td input[type=text]:focus{border-color:var(--accent);background:var(--input)}
table.t tr:hover td{background:color-mix(in srgb,var(--panel-2) 70%,transparent)}
table.t tr.hd td{background:var(--panel-2)}
table.t tr.hd input[type=text]{font-weight:600;color:var(--ink-2)}
table.t td.oz input{font-weight:650}
.ra{display:flex;gap:0;opacity:.35;transition:opacity .12s;justify-content:flex-end}
tr:hover .ra,.ra:focus-within{opacity:1}
@media (hover:none){.ra{opacity:1}}
.tfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--soft);padding:14px 18px;border-top:1px solid var(--line)}

/* ---------- karty měření ---------- */
.mgroup{display:flex;align-items:center;gap:10px;margin:22px 2px 8px;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mgroup::after{content:"";flex:1;height:1px;background:var(--line)}
.mc{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.mc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--idle)}
.mc.s-ok::before{background:var(--ok)}
.mc.s-bad::before{background:var(--bad)}
.mc.s-bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.mc.s-x{opacity:.55;box-shadow:none}
.mc-h{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 18px;flex-wrap:wrap}
.mc-id{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.mc-id b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.mc-id span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);letter-spacing:.03em}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}
.pill svg.ic{width:13px;height:13px}
.mc-b{padding:4px 14px 14px 18px;display:flex;flex-direction:column;gap:10px}
.fr{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.ig{display:inline-flex;align-items:stretch;border:1px solid var(--line-2);border-radius:8px;background:var(--input);overflow:hidden;transition:border-color .12s,box-shadow .12s}
.ig:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ig span,.ig em{display:flex;align-items:center;padding:0 8px;font-size:12px;color:var(--muted);background:var(--panel-2);font-style:normal;white-space:nowrap}
.ig span{border-right:1px solid var(--line);font-weight:600;color:var(--ink-2)}
.ig em{border-left:1px solid var(--line)}
.ig input{border:0;border-radius:0;width:68px;padding:6px 8px;box-shadow:none!important;background:transparent}
.ig input.w{width:220px}
.ig input.s{width:52px}
.rcd{display:grid;grid-template-columns:64px repeat(4,minmax(70px,96px));gap:6px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:max-content;max-width:100%;overflow-x:auto}
.rcd .h{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.rcd input[type=text]{width:100%;padding:5px 7px}
.rcd-w{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}

/* ---------- kapitoly ---------- */
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel);overflow:hidden}
.sec-h{display:flex;gap:10px;align-items:center;padding:8px 10px 8px 14px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.sec-h input[type=text]{flex:1;font-weight:600;background:transparent;border-color:transparent}
.sec-h input[type=text]:hover{border-color:var(--line-2);background:var(--input)}
.sec textarea{border:0;border-radius:0;padding:12px 14px;box-shadow:none!important;background:var(--panel)}
.sec.off{opacity:.55}
.sec.off .sec-h{border-bottom:0}
.sec .special{display:flex;gap:8px;align-items:center;color:var(--soft-ink);background:var(--soft);font-size:12.5px;padding:8px 14px;border-top:1px solid var(--line)}
.sec .auto{flex:1;font-weight:600;padding:6px 10px;display:flex;align-items:center;gap:8px}
.tokens{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tokens code{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);color:var(--soft-ink);padding:2px 6px;border-radius:5px}

/* ---------- náhled ---------- */
.pv{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media (max-width:1000px){.pv{grid-template-columns:1fr}}
.pv .side{top:120px}
.exp{display:flex;flex-direction:column;gap:8px}
.exp .btn{justify-content:flex-start}
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wl li{display:flex;gap:8px;font-size:13px;color:var(--bad);background:var(--bad-soft);padding:7px 10px;border-radius:8px}
.okbox{display:flex;gap:8px;align-items:center;color:var(--ok);background:var(--ok-soft);padding:9px 12px;border-radius:8px;font-weight:600;font-size:13px}
.paper-wrap{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:28px 16px;overflow-x:auto}
.paper{background:#fff;color:#000;font:11pt/1.25 "Times New Roman",Times,serif;padding:2cm;max-width:21cm;margin:0 auto;box-shadow:0 4px 18px rgba(0,0,0,.12);border-radius:2px;tab-size:6}
.paper p{margin:0;white-space:pre-wrap;min-height:1.25em}

/* ---------- notifikace ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);transition:all .2s;z-index:50;display:flex;gap:8px;align-items:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

/* ---------- iPad / instalovaná aplikace ---------- */
.top{padding-top:env(safe-area-inset-top)}
.bar,.steps{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.toast{bottom:calc(22px + env(safe-area-inset-bottom))}
html{-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){.ib{width:36px;height:36px}.btn.sm{padding:8px 11px}.steps button{min-height:40px}}
@media (display-mode:standalone){body{overscroll-behavior-y:none}}
.net{font-size:12px;font-weight:600;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:2px 8px;border-radius:20px;display:none}
.net.on{display:inline-block}
.banner{max-width:1440px;margin:12px auto 0;padding:0 max(20px,env(safe-area-inset-left))}
.banner>div{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);color:var(--soft-ink);border-radius:10px;padding:9px 12px;font-size:13px}
.banner>div span{flex:1;min-width:200px}
/* seznam objektů */
dialog.sheet{border:0;padding:0;background:var(--panel);color:var(--ink);border-radius:16px;box-shadow:var(--shadow-lg);width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:none;flex-direction:column}
dialog.sheet[open]{display:flex}
dialog.sheet::backdrop{background:rgba(15,18,24,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;font-size:17px;font-weight:650;flex:1}
.sh-t{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sh-t input{flex:1;min-width:180px;font-size:16px}
.sh-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px}
.sh-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sh-f .hint{flex:1;min-width:200px}
.ol{list-style:none;margin:0;padding:0}
.ol li{display:flex;align-items:center;gap:6px;border-radius:10px}
.ol li.on{background:var(--soft)}
.ol li>button.o{flex:1;min-width:0;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ol li>button.o:hover{background:var(--panel-2)}

<script id="core">
const uid = () => Math.random().toString(36).slice(2, 9);

// ---------- čísla ----------
const num = v => { if (v == null) return NaN; const s = String(v).replace(',', '.').replace(/[<>=\s]/g, ''); return s === '' ? NaN : parseFloat(s); };
const cz = v => String(v ?? '').trim().replace(/\./g, ',');
const has = v => v != null && String(v).trim() !== '';

// ---------- rozbor přístroje (jistič / chránič) ----------
function parseDevice(pristroj, oz) {
  const s = pristroj || '';
  const r = { char: null, In: null, poles: null, rcd: false, idn: 30 };
  const m = s.match(/(?:^|[^A-Za-z0-9])([BCD])\s?(\d{1,3})(?:\s*A)?\s*\/\s*([1-4])/i) || s.match(/(?:^|[^A-Za-z0-9])([BCD])\s?(\d{1,3})\b/i);
  if (m) { r.char = m[1].toUpperCase(); r.In = +m[2]; if (m[3]) r.poles = +m[3]; }
  if (!r.poles) { const p = s.match(/\d\s*\/\s*([1-4])\s*N?\b/i); if (p) r.poles = +p[1]; }
  const d = s.match(/\/\s*(0\d{1,2})(?!\d)/);
  if (d) { r.rcd = true; r.idn = Math.round(parseInt(d[1], 10) / Math.pow(10, d[1].length - 1) * 1000); }
  if (/chráni|RCD|RCBO/i.test(s) || /^(FI|FAI|FC|QFI)/i.test(oz || '')) r.rcd = true;
  return r;
}

// ---------- kontrola naměřených hodnot ----------
function checkRow(row, board, S) {
  const w = [], m = row.m || {};
  if (row.kind !== 'c' || m.state !== 'm') return w;
  const dev = parseDevice(row.pristroj, row.oz);
  const k = { B: 5, C: 10, D: 20 }[dev.char];
  const Uo = num(S.uo) || 230, coef = num(S.zsCoef) || 1;
  const zs = row.f3 ? [m.zs1, m.zs2, m.zs3] : [m.zs];
  if (k && dev.In) {
    const lim = coef * Uo / (k * dev.In);
    zs.forEach((z, i) => { const v = num(z); if (v > lim) w.push(`Zs${row.f3 ? ' L' + (i + 1) : ''} ${cz(z)} Ω > max ${cz(lim.toFixed(2))} Ω (${dev.char}${dev.In})`); });
  }
  const ri = num(m.riso); if (has(m.riso) && ri < 1) w.push(`Riso ${cz(m.riso)} MΩ < 1 MΩ`);
  if (row.rcd) {
    const idn = num(m.idn) || dev.idn || 30;
    [['ac', 'AC'], ['ap', 'A+'], ['am', 'A-']].forEach(([key, lb]) => {
      const t = m[key]; if (!t || !t.on) return;
      const i = num(t.i), tt = num(t.t), t5 = num(t.t5), uc = num(t.uc);
      if (i > idn) w.push(`(${lb}) IΔ ${cz(t.i)} mA > IΔn ${idn} mA`);
      if (i < idn / 2) w.push(`(${lb}) IΔ ${cz(t.i)} mA < ½ IΔn`);
      if (tt > 300) w.push(`(${lb}) t ${cz(t.t)} ms > 300 ms`);
      if (t5 > 40) w.push(`(${lb}) 5×IΔn ${cz(t.t5)} ms > 40 ms`);
      if (uc > 50) w.push(`(${lb}) Uc ${cz(t.uc)} V > 50 V`);
    });
  }
  return w;
}

function textBlock(text, P) {
  const S = P.settings, out = [];
  const zk = P.zkousky.map(z => `${S.odrazky ? '•\t' : ''}${z.t} – ${z.v}`);
  String(text || '').replace(/\{VZOREC\}/g, vzorec(S)).replace(/\{LET\}/g, 'za ' + letWord(P.meta.let))
    .replace(/\{POSUDEK\}/g, P.meta.schopny ? 'SCHOPNÉ PROVOZU' : 'NESCHOPNÉ PROVOZU')
    .split('\n').forEach(line => {
      if (line.trim() === '{ZKOUSKY}') { zk.forEach(z => out.push(P_(z, S.odrazky ? { tabs: [[360, 'left']], ind: { left: 360, hanging: 360 } } : {}))); return; }
      if (line.startsWith('# ')) out.push(P_([{ t: line.slice(2), b: true, size: 13 }], { align: 'center' }));
      else out.push(P_(line));

}

function circuitLine(r, S) {
  const parts = [];
  const dev = [r.slovo, r.pristroj].filter(has).join(' – ');
  if (S.poradi === 'afterId' && has(r.popis)) {
    let s = `${r.oz}- ${r.popis}`; if (dev) s += ' – ' + dev; if (has(r.kabel)) s += ', kabel ' + r.kabel; return s;
  }
  parts.push(r.oz); if (dev) parts.push(dev);
  let s = parts.filter(has).join(' – ');
  if (has(r.kabel)) s += ', kabel ' + r.kabel;
  if (has(r.popis)) s += ', ' + r.popis;
  return s;
}

function boardParas(b, P) {
  const out = [];
  out.push(P_([{ t: b.name + ':', b: true }, { t: has(b.popis) ? ' ' + b.popis : '' }], { keep: true }));
  out.push(EMPTY());
  if (has(b.privod)) { out.push(P_('Přívod – ' + b.privod)); out.push(EMPTY()); }
  b.rows.forEach((r, i) => {
    if (r.kind === 'h') { if (i > 0) out.push(EMPTY()); out.push(P_(r.text)); }
    else out.push(P_(circuitLine(r, P.settings)));

  out.push(EMPTY());

}

  if (b.pm && b.pm.on) {

  }
  out.push(EMPTY());
  let lastWasHeading = false;
  b.rows.forEach((r, idx) => {
    if (r.kind === 'h') {

      const seg = b.rows.slice(idx + 1, anyLater < 0 ? undefined : idx + 1 + anyLater);
      if (!seg.some(x => x.kind === 'c' && x.m.state !== 'x')) return;
      if (out.length && !lastWasHeading && out[out.length - 1].runs[0].t !== '') out.push(EMPTY());
      out.push(P_(r.text)); lastWasHeading = true; return;
    }
    const m = r.m; if (m.state === 'x') return;

    const o = { tabs: MTAB };
    if (m.state === 'n') { out.push(P_(`${r.oz}\tZs = neměř.`, o)); return; }
    const U = has(m.u) ? m.u : U0;
    const zsTxt = r.f3 ? ([1, 2, 3].some(i => has(m['zs' + i])) ? zs3(m, U) : 'neměř.') : (has(m.zs) ? `${r.rcd ? '' : 'L- '}${cz(m.zs)}Ω / ${cz(U)}V` : 'neměř.');
    if (r.rcd) {
      const tests = [['ac', 'AC'], ['ap', 'A+'], ['am', 'A-']].filter(([k]) => m[k] && m[k].on);
      const lines = tests.map(([k, lb]) => { const t = m[k]; return `(${lb}) I∆ = ${cz(t.i)}mA, t = ${cz(t.t)}ms, Uc= ${cz(has(t.uc) ? t.uc : '0')}V, 5x přetížení – ${cz(t.t5)}ms`; });
      if (!lines.length) lines.push('');
      const ri = risoStr(m.riso, m.risoU), zs = 'Zs = ' + zsTxt;
      if (lines.length === 1) lines[0] += `, ${cz(U)}V; ${ri}; ${zs}`;
      else { lines[0] += `, ${cz(U)}V`; lines[1] += `, ${cz(U)}V; ${ri}`; lines[lines.length - 1] += `; ${zs}`; }
      if (has(m.poz)) lines[lines.length - 1] += ' – ' + m.poz;
      lines.forEach((l, i) => out.push(P_((i === 0 ? r.oz : '') + '\t' + l, o)));
      if (m.half) out.push(P_('\t½x přetížení > 300ms, funkční zkouška test tlačítka – v pořádku', o));
      if (r.f3 && m.sled) out.push(P_('\t' + sled(m), o));

    out.push(P_(`${r.oz}\tZs = ${zsTxt}; ${risoStr(m.riso, m.risoU)}` + (has(m.poz) ? ' – ' + m.poz : ''), o));
    if (r.f3 && m.sled) out.push(P_('\t' + sled(m), o));
  });

  return out;
}

function bodyParas(P) {

  P.sections.filter(s => s.on).forEach(s => {

function incLabel(s) { return String(s).replace(/(\d+)(?!.*\d)/, d => String(+d + 1)); }
function freshIds(o) { if (o && typeof o === 'object') { if ('id' in o) o.id = uid(); Object.values(o).forEach(freshIds); } return o; }
function move(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
function download(name, blobParts, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(blobParts, { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
// Na iPadu nabídne systémové „Sdílet“ (Uložit do Souborů / iCloud Drive, Mail, AirDrop, Word…), jinde klasické stažení.
const touchDevice = () => matchMedia('(pointer:coarse)').matches;
async function shareFile(name, blobParts, type) {
  const file = new File(blobParts, name, { type });
  if (touchDevice() && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return 'shared'; }
    catch (e) { if (e.name === 'AbortError') return 'cancel'; }
  }
  download(name, blobParts, type); return 'downloaded';
}
const today = () => new Date().toISOString().slice(0, 10);
const fmtTime = t => t ? new Date(t).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'nikdy';
const notBackedUp = () => { const b = ls.get(LS_BAK, 0); return objIndex().filter(o => o.updated > b); };

async function backupAll() {
  flushSave();
  const objects = objIndex().map(o => objLoad(o.id)).filter(Boolean);
  const data = { format: 'revize-zaloha', v: 1, created: new Date().toISOString(), objects };
  const r = await shareFile(`Revize-zaloha-${today()}.json`, [JSON.stringify(data)], 'application/json');
  if (r === 'cancel') return;
  ls.set(LS_BAK, Date.now()); updBanner(); if (objDlg.open) renderObjs();
  toast(r === 'shared' ? `Záloha ${objects.length} objektů připravena` : `Záloha ${objects.length} objektů uložena do Stažených`);
}

function importData(d, name) {
  if (d && d.format === 'revize-zaloha' && Array.isArray(d.objects)) {
    let added = 0, skipped = 0;
    d.objects.forEach(o => {
      if (!o || !o.meta || !o.boards) return;
      o.id = o.id || longId(); o.updated = o.updated || Date.now();
      const local = objIndex().find(x => x.id === o.id);
      if (local && local.updated >= o.updated) { skipped++; return; }
      objStore(o); added++;
    });
    const fresh = objLoad(P.id); if (fresh) P = fresh;
    render(); if (objDlg.open) renderObjs(); updBanner();
    toast(`Obnoveno ${added} objektů` + (skipped ? `, ${skipped} přeskočeno (v iPadu jsou novější)` : ''));
    return;
  }
  if (!d || !d.meta || !d.boards) throw 0;
  if (d.id && objIndex().some(o => o.id === d.id)) {
    if (!confirm(`Objekt „${d.meta.misto || d.meta.cislo || 'bez názvu'}“ už v iPadu je. Přepsat ho verzí ze souboru?\n(Zrušit = uložit jako nový objekt.)`)) d.id = longId();
  }
  d.id = d.id || longId(); d.updated = Date.now(); objStore(d);
  switchTo(d); if (objDlg.open) objDlg.close(); toast('Načteno: ' + name);
}

async function copyParas(ps) {
  const html = `<div style="font-family:'Times New Roman';font-size:11pt">${parasToHtml(ps, true)}</div>`, text = parasToText(ps);
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
  } catch (err) {
    const d = document.createElement('div'); d.innerHTML = html; d.style.position = 'fixed'; d.style.left = '-9999px'; document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    document.execCommand('copy'); s.removeAllRanges(); d.remove();
  }
  toast('Zkopírováno do schránky');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, i = +t.dataset.i, b = P.boards[cur];
  switch (a) {
    case 'new': {
      // nový objekt – technik, nastavení a texty kapitol se převezmou z aktuálního, předchozí objekt zůstává uložený
      flushSave(); const n = defaultProject(P); n.id = longId(); n.updated = Date.now(); objStore(n);
      tab = 'hlavicka'; ls.set(LS_TAB, tab); switchTo(n); if (objDlg.open) objDlg.close(); toast('Založen nový objekt'); return;
    }
    case 'objs': openObjs(); return;
    case 'objClose': objDlg.close(); return;
    case 'objOpen': { const p = t.dataset.id === P.id ? P : objLoad(t.dataset.id); if (p) switchTo(p); objDlg.close(); return; }
    case 'objDup': {
      flushSave(); const src = objLoad(t.dataset.id); if (!src) return;
      const c = clone(src); c.id = longId(); c.updated = Date.now(); c.meta.cislo = ''; objStore(c);
      renderObjs(); toast('Objekt zduplikován – doplňte nové číslo zprávy'); return;
    }
    case 'objDel': {
      const o = objIndex().find(x => x.id === t.dataset.id); if (!o) return;
      if (!confirm(`Smazat objekt „${o.misto || o.cislo || 'bez názvu'}“ z iPadu?` + (o.updated > ls.get(LS_BAK, 0) ? '\n\nPozor: od poslední zálohy byl změněn.' : ''))) return;
      if (o.id === P.id) clearTimeout(saveT), saveT = null;
      objRemove(o.id);
      if (o.id === P.id) { const nx = objIndex()[0]; if (nx) switchTo(objLoad(nx.id)); else { const n = defaultProject(P); n.id = longId(); objStore(n); switchTo(n); } }
      renderObjs(); updBanner(); return;
    }
    case 'objExp': {
      flushSave(); const p = t.dataset.id === P.id ? P : objLoad(t.dataset.id); if (!p) return;
      const prev = P; P = p; const name = fileBase() + '.json'; P = prev;
      shareFile(name, [JSON.stringify(p, null, 1)], 'application/json').then(r => r === 'downloaded' && toast('Objekt uložen do Stažených')); return;
    }
    case 'backup': backupAll(); return;
    case 'bakSnooze': ls.set('revize.bakSnooze', Date.now()); updBanner(); return;
    case 'installHide': ls.set('revize.installHid', true); updBanner(); return;
    case 'open': document.getElementById('fileIn').click(); return;
    case 'saveJson': shareFile(fileBase() + '.json', [JSON.stringify(P, null, 1)], 'application/json').then(r => r === 'downloaded' && toast('Projekt uložen do Stažených')); return;
    case 'docx': shareFile(fileBase() + '.docx', zipStore(docxFiles(P)), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document').then(r => r === 'downloaded' && toast('Word uložen do Stažených')); return;
    case 'copy': {
      const w = t.dataset.w;
      const ps = w === 'all' ? allParas(P) : w === 'boards' ? P.boards.flatMap(x => boardParas(x, P)) : P.boards.flatMap(x => measureParas(x, P));
      copyParas(ps); return;
    }
    case 'loadProf': { const profs = ls.get(LS_PROF, null) || PROFILY; P.technik = clone(profs[i]); toast('Načten profil ' + P.technik.jmeno); break; }
    case 'saveProf': {
      const profs = ls.get(LS_PROF, null) || clone(PROFILY);
      const k = profs.findIndex(p => p.jmeno === P.technik.jmeno);
      if (k >= 0) profs[k] = clone(P.technik); else profs.push(clone(P.technik));
      ls.set(LS_PROF, profs); toast('Profil uložen'); break;
    }
    case 'secUp': move(P.sections, i, -1); break;
    case 'secDown': move(P.sections, i, 1); break;
    case 'secDel': if (!confirm('Smazat kapitolu „' + P.sections[i].title + '“?')) return; P.sections.splice(i, 1); break;
    case 'secAdd': P.sections.push({ id: uid(), type: 'text', on: true, title: 'Nová kapitola', text: '' }); break;
    case 'pick': cur = i; break;
    case 'bAdd': P.boards.push(newBoard({ name: 'Rozváděč R' + (P.boards.length + 1) })); cur = P.boards.length - 1; break;
    case 'bUp': move(P.boards, cur, -1); cur = Math.max(0, cur - 1); break;
    case 'bDown': if (cur < P.boards.length - 1) { move(P.boards, cur, 1); cur++; } break;
    case 'bDup': { const c = freshIds(clone(b)); c.name += ' (kopie)'; P.boards.splice(cur + 1, 0, c); cur++; toast('Rozvaděč zduplikován'); break; }
    case 'bDel': if (!confirm(`Smazat rozvaděč „${b.name}“ včetně měření?`)) return; P.boards.splice(cur, 1); break;
    case 'rAdd': {
      const last = [...b.rows].reverse().find(r => r.kind === 'c');
      b.rows.push(last ? Object.assign(newRow(), { oz: incLabel(last.oz), slovo: last.slovo, pristroj: last.pristroj, kabel: last.kabel, f3: last.f3, rcd: last.rcd, lock: last.lock }) : newRow({ oz: 'FA1' }));
      break;
    }
    case 'hAdd': b.rows.push(newHeading(`${b.rows.filter(r => r.kind === 'h').length + 1}. řada: `)); break;
    case 'rDup': { const c = freshIds(clone(b.rows[i])); if (c.kind === 'c') { c.oz = incLabel(c.oz); c.m = newRow().m; } b.rows.splice(i + 1, 0, c); break; }
    case 'rUp': move(b.rows, i, -1); break;
    case 'rDown': move(b.rows, i, 1); break;
    case 'rDel': b.rows.splice(i, 1); break;
    case 'bulkToggle': bulkOpen = !bulkOpen; break;
    case 'bulkAdd': {
      const g = id => document.getElementById(id).value, pre = g('bk-pre'), od = parseInt(g('bk-od')), dd = parseInt(g('bk-do'));
      if (!(od <= dd) || dd - od > 200) { alert('Zkontrolujte rozsah Od–Do.'); return; }
      const d = parseDevice(g('bk-pr'), pre);
      for (let n = od; n <= dd; n++) b.rows.push(newRow({ oz: pre + n, pristroj: g('bk-pr'), kabel: g('bk-ka'), popis: g('bk-po').replace(/\{n\}/g, n), f3: (d.poles || 1) >= 3, rcd: d.rcd }));
      bulkOpen = false; updateLib(); toast(`Přidáno ${dd - od + 1} obvodů`); break;
    }
    case 'mPrev': {
      const prev = b.rows.slice(0, i).reverse().find(r => r.kind === 'c');
      if (!prev) return; b.rows[i].m = clone(prev.m); break;
    }
    case 'fillRiso': b.rows.forEach(r => { if (r.kind === 'c' && r.m.state === 'm' && !has(r.m.riso)) r.m.riso = P.settings.defRiso; }); break;
    case 'allState': b.rows.forEach(r => { if (r.kind === 'c') r.m.state = t.dataset.v; }); break;
    default: return;
  }
  save(); render();
});

document.getElementById('fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { importData(JSON.parse(await f.text()), f.name); }
  catch (err) { alert('Soubor nejde načíst – není to projekt ani záloha revizních zpráv.'); }
  e.target.value = '';
});

updateLib();
render();
updNet(); updBanner();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
